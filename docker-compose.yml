version: '3.8'

services:
  # 1. Primary PostgreSQL 16 Relational Database
  postgres:
    image: postgres:16-alpine
    container_name: talent5_postgres
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    environment:
      POSTGRES_USER: ${DATABASE_USER:-postgres}
      POSTGRES_PASSWORD: ${DATABASE_PASSWORD:?DATABASE_PASSWORD must be set}
      POSTGRES_DB: ${DATABASE_NAME:-talent5_v1}
    # Not published to the host. The database is only reachable on the internal
    # Docker network by the application container. Expose a port explicitly only
    # when you need external access, and never with default credentials.
    expose:
      - "5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infrastructure/database/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro
      - ./infrastructure/database/seed.sql:/docker-entrypoint-initdb.d/02-seed.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DATABASE_USER:-postgres} -d ${DATABASE_NAME:-talent5_v1}"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 2. Next.js Web App & API Service
  web:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: talent5_web
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    security_opt:
      - no-new-privileges:true
    # Secrets are injected from the environment / a .env file (see .env.example),
    # never hardcoded here. Required vars fail the deploy if unset.
    environment:
      NODE_ENV: production
      PORT: 3000
      DATABASE_URL: ${DATABASE_URL:?DATABASE_URL must be set}
      JWT_SECRET: ${JWT_SECRET:?JWT_SECRET must be set}
      JWT_EXPIRATION: ${JWT_EXPIRATION:-7d}
      STORAGE_DRIVER: ${STORAGE_DRIVER:-local}
      STORAGE_LOCAL_DIR: ${STORAGE_LOCAL_DIR:-./public/uploads}
      PAYMENT_WEBHOOK_SECRET: ${PAYMENT_WEBHOOK_SECRET:?PAYMENT_WEBHOOK_SECRET must be set}
    ports:
      - "3000:3000"
    volumes:
      - uploads_data:/app/frontend/public/uploads

  # 3. Nginx Edge Reverse Proxy & Cache
  nginx:
    image: nginx:alpine
    container_name: talent5_nginx
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      - web
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - uploads_data:/var/www/uploads:ro

volumes:
  pgdata:
    driver: local
  uploads_data:
    driver: local
